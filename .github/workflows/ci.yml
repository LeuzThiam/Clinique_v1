name: Integration Continue

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v6

      - name: Installer .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Restaurer le frontend
        run: dotnet restore frontend/MaBoutique/MaBoutique.sln

      - name: Restaurer le backend
        run: dotnet restore backend/EC_MicroServices/EC_MicroServices.sln

      - name: Compiler le frontend
        run: dotnet build frontend/MaBoutique/MaBoutique.sln --configuration Release --no-restore

      - name: Compiler le backend
        run: dotnet build backend/EC_MicroServices/EC_MicroServices.sln --configuration Release --no-restore
